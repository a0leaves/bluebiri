---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

stages:
  - name: soteria-builder
    from: registry.fedoraproject.org/fedora:41
    modules:
      - type: script
        snippets:
          - |
            set -euo pipefail
            
            # 1. Install build dependencies
            dnf install -y cargo gtk4-devel polkit-gobject-devel gettext git
            
            # 2. Clone specific version tag of Soteria
            git clone --branch v0.3.2 https://github.com/imvaskel/soteria.git /tmp/soteria
            
            # 3. Build release binary
            cd /tmp/soteria
            cargo build --release

modules:
  # Copy compiled binary from builder stage to final image
  - type: copy
    from: soteria-builder
    src: /tmp/soteria/target/release/soteria
    dest: /usr/bin/soteria
