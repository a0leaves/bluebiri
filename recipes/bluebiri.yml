---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bluebiri
# description will be included in the image's metadata
description: The Bluefin image from Universal Blue with Niri included. Made with Blue Build.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin
image-version: stable

stages:
  - name: manual-app-builds
    from: registry.fedoraproject.org/fedora:41
    modules:
      - from-file: soteria-builder.yml

modules:
  # Copy compiled binary from builder stage to final image
  - type: copy
    from: manual-app-builds
    src: /tmp/soteria/target/release/soteria
    dest: /usr/bin/soteria
  - from-file: common-modules.yml
