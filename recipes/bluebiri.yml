---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bluebiri
# description will be included in the image's metadata
description: The Bluefin image from Universal Blue with Niri included. Made with Blue Build.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bluefin
image-version: stable

stages:
  - name: soteria-builder
    from: registry.fedoraproject.org/fedora:41
    modules:
      - type: script
        snippets:
          - |
            set -euo pipefail
            dnf install -y cargo gtk4-devel polkit-devel gettext git
            git clone --branch v0.3.2 https://github.com/imvaskel/soteria.git /tmp/soteria
            cd /tmp/soteria
            cargo build --release

modules:
  - type: copy
    from: soteria-builder
    src: /tmp/soteria/target/release/soteria
    dest: /usr/bin/soteria
  - from-file: common-modules.yml
